.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:none}
.brand img{height:30px;width:auto;display:block;background:#fff;border:1px solid var(--hline);border-radius:8px;padding:3px 8px}
.brand b{font-family:var(--display);letter-spacing:.28em;text-transform:uppercase;font-size:12px;color:var(--hmuted);border-left:3px solid var(--hred);padding-left:10px;line-height:1.1;font-weight:600;white-space:nowrap}
.mods[hidden]{display:none!important}
.mods{display:flex;gap:4px;min-width:0;overflow-x:auto;height:100%;align-items:stretch;margin-left:auto}
.mt{background:none;border:0;padding:0 14px;cursor:pointer;color:var(--hmuted);font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:13px;white-space:nowrap;transition:color .2s,background .2s}

.mt[aria-selected=true]{color:var(--hacc);box-shadow:inset 0 -3px 0 var(--hacc)}
.mt:focus-visible{outline:2px solid var(--hacc);outline-offset:-2px}
.host{display:block;padding-top:calc(var(--navh) + env(safe-area-inset-top,0px))}
.host[hidden]{display:none!important}
.fail{margin:24px 16px;padding:14px 16px;border:1px solid var(--hred);border-radius:12px;color:var(--hred)}

-late-bg),transparent 70%),var(--bg)}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\n.wrap{max-width:1280px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;position:relative}\nh1{font-family:var(--display);font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1}\n.sub{color:var(--muted);margin:6px 0 0;min-width:0}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.lbl,.f label{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}\n\n/* panel kaca dengan cahaya yang mengikuti kursor */\n.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;min-width:0}\n.panel::before{content:\"\";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .25s;\n  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--accent),transparent 65%);\n  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}\n.panel:hover::before{opacity:.9}\n.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px}\n.ptitle h2{margin:0;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.04em}\n.ptitle span{color:var(--muted);font-size:12px}\n\ninput,select,button{font:inherit;color:var(--fg)}\ninput[type=search],input[type=password],input[type=text],input[type=date],input[type=datetime-local],select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}\ninput[type=search]:focus,input[type=password]:focus,input[type=text]:focus,input[type=date]:focus,input[type=datetime-local]:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.f{display:flex;flex-direction:column;gap:5px;min-width:0}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s}\n.chip:hover{border-color:var(--accent);transform:translateY(-1px)}\n.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 0 18px var(--glow)}\n.chip .c{font-family:var(--mono);font-size:12px;opacity:.8}\n.check{display:flex;gap:7px;align-items:center;cursor:pointer}\n.check input{accent-color:var(--accent);width:16px;height:16px}\n.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600}\n.link:hover{text-decoration:underline}\n\n.top{display:flex;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;align-items:flex-start}\n.top>div{min-width:0}\n.brand{display:flex;flex-direction:column;align-items:flex-start;gap:14px}\n.lockup{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;max-width:100%}\n.unit{border-left:4px solid var(--late);padding-left:16px;display:flex;flex-direction:column;line-height:1;font-family:var(--display);text-transform:uppercase}\n.unit span{font-size:13px;letter-spacing:.32em;color:var(--muted);font-weight:500}\n.unit b{font-size:clamp(30px,5vw,46px);letter-spacing:.06em;color:var(--exp);font-weight:700;margin-top:6px}\n.logo{display:block;width:clamp(230px,46vw,540px);height:auto;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 20px;box-shadow:0 8px 30px rgba(0,0,0,.14)}\n.theme{background:var(--glass);border:1px solid var(--line);border-radius: px;margin-top:10px}\n.key span{display:inline-flex;gap:6px;align-items:center}.key i{width:10px;height:10px;border-radius:3px;display:block}\n.routes{display:flex;flex-direction:column;gap:6px}\n.rt{display:grid;grid-template-columns:minmax(84px,.9fr) 2fr auto;gap:10px;align-items:center;background:none;border:1px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}\n.rt:hover{background:var(--surface2)}\n.rt.sel{border-color:var(--accent);background:var(--accent-soft)}\n.rt .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}\n.rbar{display:block;height:10px;background:var(--line);border-radius:6px;overflow:hidden}\n.rfill{display:flex;height:100%;border-radius:6px;overflow:hidden;transition:width .6s cubic-bezier(.2,.8,.2,1)}\n.rfill i{display:block}\n.rv{font-size:12px;color:var(--muted);min-width:2.4em;text-align:right}\n\n/* tab dan tabel */\n.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:relative;overflow-x:auto}\n.tab{background:none;border:0;padding:12px 18px;cursor:pointer;color:var(--muted);font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;white-space:nowrap;transition:color .2s}\n.tab:hover{color:var(--fg)}\n.tab[aria-selected=true]{color:var(--accent);text-shadow:0 0 14px var(--glow);box-shadow:inset 0 -2px 0 var(--accent)}\n.count{padding:10px 4px;color:var(--muted)}\n.tblwrap{overflow:hidden}\n.tbl{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:820px}\nth,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}\nth{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface);position:sticky;top:0;cursor:pointer;user-select:none;transition:color .2s}\nth:hover{color:var(--accent)}\nth.r,td.r{text-align:right}\ntbody tr{transition:background .15s,box-shadow .15s}\ntbody tr:hover{background:var(--accent-soft)}\ntr.click{cursor:pointer}\ntr.click:hover{box-shadow:inset 3px 0 0 var(--accent)}\ntr.click:focus-visible{outline-offset:-2px}\n.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}\n.p-JAM{background:var(--exp-bg);color:var(--exp);border-color:var(--exp)}.p-NORMAL{background:var(--nor-bg);color:var(--nor);border-color:var(--nor)}.p-TERLAMBAT{background:var(--late-bg);color:var(--late);border-color:var(--late)}\n.p-ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}\n.tcnt{display:inline-block;min-width:18px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--late);color:#fff;font-size:11px;line-height:18px;text-align:center}\n.cfhint{color:var(--muted);font-size:12px;margin-left:8px}\n.count .cf{margin-right:6px}\ntd.cat{white-space:normal;min-width:260px;max-width:420px}\n.cekbox{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);display:flex;flex-direction:column;gap:10px}\n.cekbox textarea{width:100%;min-height:84px;resize:vertical;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}\n.cekbox textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n.cekbox .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.cekmeta{color:var(--muted);font-size:12px}\n.p-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}\n.late{color:var(--late)}.good{color:var(--exp)}\n.tk{color:var(--accent);font-weight:600}\n.p-na{background:var(--surface2);color:var(--muted);border-color:var(--line);font-weight:500}\n.tknote{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}\n.okc{display:inline-flex;gap:8px;align-items:center;justify-content:flex-end}\n.okb{width:64px;height:6px;border-radius:4px;background:var(--late-bg);overflow:hidden;display:block}\n.okb i{display:block;height:100%;background:var(--exp);box-shadow:0 0 8px var(--exp)}\n.empty{padding:36px;text-align:center;color:var(--muted)}\n.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px}\n.pager button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;transition:border-color .2s}\n.pager button:hover:not(:disabled){border-color:var(--accent)}\n.pager button:disabled{opacity:.4;cursor:default}\n\n/* tooltip */\n#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.5;box-shadow:0 0 24px var(--glow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;max-width:240px}\n#tip.on{opacity:1;transform:none}\n#tip b{font-family:var(--display);letter-spacing:.04em;display:block}\n\n/* panel detail trip */\n#veil{position:fixed;inset:0;z-index:40;background:rgba(2,6,14,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}\n#veil.on{opacity:1;pointer-events:auto}\n#dr{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--accent);box-shadow:-20px 0 60px rgba(0,0,0,.35),0 0 40px var(--glow);transform:translateX(104%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n#dr.on{transform:none;visibility:visible}\n.dh{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}\n.dh h3{margin:0;font-family:var(--display);font-size:20px;line-height:1.2;overflow-wrap:anywhere}\n.dh p{margin:4px 0 0;color:var(--muted)}\n.dx{background:var(-- const pad=n=>String(n).padStart(2,'0');
function toSec(v){if(v==null||v==='')return null;if(typeof v==='number')return Math.round(v*86400);

/* latar jaringan titik yang bereaksi pada kursor */
(function(){
  const cv=$('bg'),cx=cv.getContext('2d');if(!cx)return;
  let W=0,H=0,P=[],mx=-999,my=-999,rgb='53,214,255',f=0;
  function col(){rgb=getComputedStyle(document.documentElement).getPropertyValue('--net').trim()||rgb}
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(90,W*H/17000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28}));col()}
  function draw(){
    cx.clearRect(0,0,W,H);
    for(const p of P){if(!RM){p.x+=p.vx;p.y+=p.vy}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<150&&d>0){p.x+=dx/d*.7;p.y+=dy/d*.7}}
    for(let i=0;i<P.length;i++){const a=P[i];
      cx.fillStyle=`rgba(${rgb},.55)`;cx.beginPath();cx.arc(a.x,a.y,1.5,0,6.283);cx.fill();
      for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<130){cx.strokeStyle=`rgba(${rgb},${(1-d/130)*.22})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
      const dm=Math.hypot(a.x-mx,a.y-my);
      if(dm<180){cx.strokeStyle=`rgba(${rgb},${(1-dm/180)*.55})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(mx,my);cx.stroke()}}
  }
  function loop(){if(!document.hidden){if(++f%90===0)col();draw()}requestAnimationFrame(loop)}
  addEventListener('resize',()=>{size();if(RM)draw()});
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});
  size();draw();if(!RM)requestAnimationFrame(loop);
})();

const GS='Google Sheets';
function extractRows(p,d=0){
  if(d>5||p==null)return null;
  if(typeof p==='string'){try{return extractRows(JSON.parse(p),d+1)}catch(e){}
    if(typeof XLSX!=='undefined'&&p.includes('\n')){try{const wb=XLSX.read(p,{type:'string'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null})}catch(e){}}return null}
  if(Array.isArray(p)){if(p.length&&p.every(Array.isArray))return p;for(const x of p){const r=extractRows(x,d+1);if(r)return r}return null}
  if(typeof p==='object'){if(p.values){const r=extractRows(p.values,d+1);if(r)return r}for(const k of Object.keys(p)){const r=extractRows(p[k],d+1);if(r)return r}}
  return null}
const gsId=u=>{const m=String(u).match(/\/d\/([A-Za-z0-9_-]{20,})/)||String(u).trim().match(/^([A-Za-z0-9_-]{30,})$/);return m?m[1]:''};

/* ---------- Login: data bawaan terenkripsi (AES-GCM), kunci dibuka oleh username + password ---------- */
let ROLE='viewer',USER='';
const te=new TextEncoder(),b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64e=u=>btoa(String.fromCharCode(...u));
const hex=u=>[...new Uint8Array(u)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function userId(u){return hex(await crypto.subtle.digest('SHA-256',te.encode(u.trim().toLowerCase()+':'+ENC.salt)))}
async function unwrap(username,password){
  const id=await userId(username),e=ENC.users.find(x=>x.id===id);
  const km=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);
  const wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(e?e.salt:ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  if(!e)return null;
  try{const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv),additionalData:te.encode(id)},wk,b64d(e.ct)));
    let areas=[];if(pt.length>33){try{areas=JSON.parse(new TextDecoder().decode(pt.slice(33))).areas||[]}catch(x){}}
    return {role:({1:'admin',2:'pusat',3:'daerah'})[pt[0]]||'viewer',key:pt.slice(1,33),areas}}catch(x){return null}
}
async function openData(keyBytes){
  const k=await crypto.subtle.importKey('raw',keyBytes,'AES-GCM',false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.iv)},k,b64d(ENC.data));
  const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(st).text())
}

function cleanRow(r){const o={};for(const k of FIELDS){const v=r[k];o[k]=NULLN.includes(k)?(v==null?null:v):NUMF.includes(k)?(typeof v==='number'?v:0):(v==null?'':String(v))}return o}

async function getVals(id,range){
  const r=await mcp.callTool(SERVER,'get_values',{spreadsheetId:id,range},{cache:false});

  if(!v){try{v=JSON.parse(r.content[0].text).values}catch(e){v=null}}

}

function errText(e,ctx){
  const c=e&&e.code,m=(e&&e.message)||'';
  if(c==='server_not_connected')return 'Konektor Google Sheets belum terhubung. Tambahkan di claude.ai, Settings, Connectors.';
  if(c==='needs_reauth')return 'Koneksi Google Sheets perlu dihubungkan ulang di claude.ai, Settings, Connectors.';
  if(c==='not_in_manifest')return 'Akses ke Google Sheets ditolak untuk halaman ini. Muat ulang halaman lalu pilih izinkan.';
  if(c==='approval_required'||c==='consent_required')return 'Halaman perlu izin Anda untuk membaca Google Sheets. Tekan Muat ulang dan izinkan.';
  if(c==='blocked_by_policy')return 'Kebijakan organisasi memblokir akses ke Google Sheets.';
  if(c==='tool_error'&&/permission|denied|access/i.test(m))return (ctx||'Spreadsheet')+': akun Google Anda belum punya akses ke file ini.';
  if(c==='tool_error')return (ctx||'Spreadsheet')+': '+m.slice(0,160);
  if(c==='server_unavailable')return 'Google Sheets sedang tidak merespons. Coba muat ulang sebentar lagi.';
  return 'Gagal mengakses Google Sheets ('+(c||'error')+').';
}

/* ---------- tanggal ---------- */
function parseDT(s,order){
  const m=String(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(!m)return null;
  const a=+m[1],b=+m[2],d=order==='dmy'?a:b,mo=order==='dmy'?b:a;
  const t=new Date(+m[3],mo-1,d,+(m[4]||0),+(m[5]||0),+(m[6]||0));
  return isNaN(t)||t.getMonth()!==mo-1?null:t;
}
function detectOrder(vals){
  let dmy=0,mdy=0;
  for(const r of vals){
    for(const i of [0,15,16,18]){
      const m=String(r[i]||'').match(/^(\d{1,2})\/(\d{1,2})\//);if(!m)continue;
      if(+m[1]>12)dmy+=3;else if(+m[2]>12)mdy+=3;
    }
    const n=String(r[1]||'').match(/^[A-Z]{3}(\d{2})(\d{2})(\d{2})\d{3}$/),t=String(r[0]||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(n&&t){
      const y=2000+ +n[1],mo=+n[2],d=+n[3];
      if(+t[3]===y&&+t[1]===d&&+t[2]===mo)dmy++;
      if(+t[3]===y&&+t[2]===d&&+t[1]===mo)mdy++;
    }
  }
  return mdy>dmy?'mdy':'dmy';
}

  const g=i=>String(r[i]==null?'':r[i]).trim(),nomor=g(1);

function stat(r){
  if(r.ar&&r.pu)return {k:'go',t:'Berangkat',d:'Disetujui Armada Pusat dan Manager'};
  if(r.ar)return {k:'park',t:'Diparkir',d:'ACC Armada Pusat selesai, menunggu ACC pusat (Manager)'};
  if(r.pu)return {k:'first',t:'ACC Armada Pusat dulu',d:'ACC pusat sudah, ACC Armada Pusat belum dicentang'};
  if(r.ac)return {k:'wait',t:'ACC area',d:'Sudah di-ACC area, menunggu ACC Armada Pusat'};
  return {k:'wait',t:'Menunggu ACC',d:'Belum ada persetujuan'};
}
const isAdminLike=()=>ME.role==='admin'||ME.role==='pusat';
const canAR=r=>isAdminLike();
const canAC=r=>isAdminLike()||(ME.role==='daerah'&&ME.areas.includes(r.code));
const canPU=()=>isAdminLike();

const unitTitle=()=>ME.role==='daerah'&&ME.areas.length?('ARMADA '+ME.areas.map(c=>((AREAS[c]&&AREAS[c].name)||NAMES[c]||c).toUpperCase()).join(', ')):'ARMADA PUSAT';
const roleLabel=()=>ME.role==='admin'?'Admin':ME.role==='pusat'?'Armada Pusat':'Armada Daerah'+(ME.areas.length?' · '+ME.areas.map(c=>(AREAS[c]&&AREAS[c].name)||c).join(', '):'');

/* ---------- area dan data ---------- */
const sheetIdOf=u=>{const m=String(u||'').match(/\/d\/([A-Za-z0-9_-]+)/);return m?m[1]:''};
async function loadAreas(){
  AREAS={};SEED.forEach(([c,n])=>AREAS[c]={name:n,sheetId:''});
  let stored={};
  try{if(db){const s=await db.doc('config/areas').get();if(s.exists)stored=(s.data()||{}).items||{}}}catch(e){}
  for(const c of Object.keys(stored))AREAS[c]={name:stored[c].name||c,sheetId:stored[c].sheetId||''};
  if(REAL.role==='admin'||REAL.role==='pusat'){
    try{
      const v=await getVals(ACC_ID,"'MASTER'!A1:C60");let changed=false;
      for(const r of v){
        const c=String(r[0]||'').trim();if(!c)continue;
        const nm=String(r[1]||'').trim(),sid=sheetIdOf(r[2]);
        const cur=AREAS[c]||{name:nm,sheetId:''};
        if((nm&&cur.name!==nm)||(sid&&cur.sheetId!==sid)){AREAS[c]={name:nm||cur.name,sheetId:sid||cur.sheetId};changed=true}
        else if(!AREAS[c])AREAS[c]=cur;
      }
      if(changed&&REAL.role==='admin'&&db){try{await db.doc('config/areas').set({items:AREAS,u:new Date().toISOString()})}catch(e){}}
    }catch(e){PROBLEMS.push(errText(e,'ACC ARMADA PUSAT (daftar area)'))}
  }
}
async function fillAc(rows){
  const codes=[...new Set(rows.map(r=>r.code))].filter(c=>AREAS[c]&&AREAS[c].sheetId);
  await Promise.all(codes.map(async c=>{
    try{
      const v=await getVals(AREAS[c].sheetId,"'DATA PEMINJAM'!B5:Y3000"),m=new Map();
      v.forEach(x=>{const n=String((x&&x[0])||'').trim();if(n)m.set(n,B(x[23]))});
      rows.forEach(r=>{if(r.code===c)r.ac=!!m.get(r.nomor)});
    }catch(e){}
  }));
}
/* Pengajuan yang sudah ada di database formulir tetapi belum ditarik ke ACC PUSAT (biasanya izin IMPORTRANGE area belum diberikan) */
async function checkSync(rows){
  SYNC=[];
  if(!isAdminLike()||SIM)return;
  try{
    const v=await getVals(FORM_ID,"'DATA'!A2:Q5000"),o=detectOrder(v),have=new Set(rows.map(r=>r.nomor));
    SYNC=v.map(r=>mkRow(r,o,'FORM')).filter(Boolean).filter(r=>!have.has(r.nomor)&&r.ts&&Date.now()-r.ts>10*60000);
  }catch(e){}
}
async function loadData(){
  PROBLEMS=PROBLEMS.slice(0,0);
  let rows=[];
  if(isAdminLike()||SIM){
    try{
      const v=await getVals(ACC_ID,"'ACC PUSAT'!A2:Y5000"),o=detectOrder(v);
      rows=v.map(r=>mkRow(r,o,'ACC')).filter(Boolean);
      if(ME.role==='daerah')rows=rows.filter(r=>ME.areas.includes(r.code));
      await fillAc(rows);
    }catch(e){PROBLEMS.push(errText(e,'ACC ARMADA PUSAT'))}
  }else{
    for(const c of ME.areas){
      const a=AREAS[c];
      if(!a||!a.sheetId){PROBLEMS.push('Spreadsheet area '+((a&&a.name)||c)+' belum didaftarkan. Minta admin menyinkronkannya.');continue}
      try{
        const v=await getVals(a.sheetId,"'DATA PEMINJAM'!A5:Y3000"),o=detectOrder(v);
        rows.push(...v.map(r=>mkRow(r,o,c)).filter(Boolean));
      }catch(e){PROBLEMS.push(errText(e,'Area '+a.name))}
    }
  }
  const now=Date.now();
  for(const r of rows){const o=OVR[r.nomor];if(!o)continue;if(now-o.t>180000){delete OVR[r.nomor];continue}for(const k of ['ar','pu','ac']){if(k in o){if(r[k]===o[k])delete o[k];else{r[k]=o[k];if(k==='ar'&&o.ar&&!r.tglAcc)r.tglAcc=new Date(o.t)}}}if(!('ar' in o)&&!('pu' in o)&&!('ac' in o))delete OVR[r.nomor]}
  if(SIM)for(const r of rows){const o=SIMO[r.nomor];if(!o)continue;if('ar' in o){r.ar=o.ar;if(o.ar&&!r.tglAcc)r.tglAcc=new Date(o.t)}if('pu' in o)r.pu=o.pu;if('ac' in o)r.ac=o.ac}
  const seen=new Map();rows.forEach(r=>seen.set(r.nomor,r));
  ROWS=[...seen.values()].sort((a,b)=>((b.ts?+b.ts:0)-(a.ts?+a.ts:0))||b.nomor.localeCompare(a.nomor));
  await checkSync(ROWS);
  LOADED=Date.now();
}

function gate(h,p,btn){
  $('gate').hidden=false;$('app').hidden=true;
  $('gate').innerHTML=`<h2>${esc(h)}</h2><p>${esc(p)}</p>`+(btn?`<button class="btn" id="gateBtn" type="button">${esc(btn)}</button>`:'');
  if(btn)$('gateBtn').onclick=boot;
}
function visibleRows(base){
  const q=S.q.trim().toLowerCase();
  return ROWS.filter(r=>{
    if(base)return true;
    if(S.area!=='ALL'&&r.code!==S.area)return false;
    if(q&&!(r.nomor+' '+r.nama+' '+r.nopol+' '+r.tuj+' '+r.tujLok).toLowerCase().includes(q))return false;
    const s=stat(r).k;
    if(S.st==='WAIT'&&r.ar)return false;
    if(S.st==='PARK'&&s!=='park')return false;
    if(S.st==='GO'&&s!=='go')return false;
    return true;
  });
}

async function savePdf(r,btn){
  const dl=await window.claude.use('downloads').catch(()=>null);
  if(!dl){$('pdfMsg').textContent='Penyimpanan file tidak tersedia di tampilan ini.';return}
  if(!window.html2canvas||!window.jspdf){$('pdfMsg').textContent='Pustaka PDF belum termuat. Pakai tombol Cetak form.';return}
  btn.disabled=true;$('pdfMsg').textContent='Menyiapkan PDF …';
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:813px;background:#fff';
  const pcss='.paper{--paper:#fff;--ink:#0b0b0b}\n'+document.querySelector('style').textContent.split('\n').filter(l=>l.startsWith('.paper')).join('\n');
  host.innerHTML='<style>'+pcss+'</style>'+formHTML(r)+checklistHTML(r);(window.__realDoc||document).body.appendChild(host);
  try{
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
    const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:[609.45,935.43]});
    const pw=doc.internal.pageSize.getWidth(),ph=doc.internal.pageSize.getHeight();
    let first=true;
    for(const el of host.children){
      if(!el.classList.contains('paper'))continue;
      const cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff'});
      let w=pw,h=cv.height*w/cv.width;if(h>ph){h=ph;w=cv.width*h/cv.height}
      if(!first)doc.addPage();first=false;
      doc.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',(pw-w)/2,0,w,h);
    }
    await dl.save({filename:`Form Peminjaman ${r.nomor}.pdf`,data:doc.output('blob')});
    $('pdfMsg').textContent='PDF siap disimpan.';
  }catch(e){$('pdfMsg').textContent=(e&&e.code==='declined')?'Penyimpanan dibatalkan.':'PDF gagal dibuat ('+((e&&e.code)||'error')+').'}
  finally{host.remove();btn.disabled=false}
}

let confT=0;
async function toggleAcc(r,k){
  if(S.busy)return;
  if(S.confirm!==k){S.confirm=k;drawDetail(r);clearTimeout(confT);confT=setTimeout(()=>{if(S.confirm===k){S.confirm=null;const x=ROWS.find(z=>z.nomor===S.cur);if(x)drawDetail(x)}},4000);return}
  clearTimeout(confT);S.confirm=null;S.busy=true;drawDetail(r);
  const val=!r[k];
  const say=(t,err)=>{const m=$('actMsg');if(m){m.textContent=t;m.classList.toggle('err',!!err)}};
  if(SIM){
    if(k==='ar'&&!canAR(r)){S.busy=false;say('Akun uji ini tidak bisa ACC Armada Pusat.',true);drawDetail(r);return}
    if(k==='ac'&&!canAC(r)){S.busy=false;say('Akun uji ini tidak berwenang untuk area ini.',true);drawDetail(r);return}
    if(k==='pu'&&!canPU()){S.busy=false;say('Akun uji ini tidak bisa ACC pusat.',true);drawDetail(r);return}
    SIMO[r.nomor]=Object.assign(SIMO[r.nomor]||{t:Date.now()},{[k]:val});
    await loadData();render();S.busy=false;const nr=ROWS.find(z=>z.nomor===r.nomor);if(nr)drawDetail(nr);
    say('Simulasi: perubahan hanya tampil di sini dan tidak dikirim ke spreadsheet.');return;
  }
  say('Menyimpan ke spreadsheet …');
  try{
    if(k==='ar'&&!canAR(r))throw {code:'local',message:'Hanya Armada Pusat dan Admin yang bisa ACC Armada Pusat.'};
    if(k==='ac'&&!canAC(r))throw {code:'local',message:'Akun Anda tidak berwenang untuk area ini.'};
    if(k==='pu'&&!canPU())throw {code:'local',message:'Hanya Armada Pusat dan Admin yang bisa ACC pusat.'};
    let sid,col,first,sheet;
    if(k==='ar'||k==='ac'){
      const a=AREAS[r.code];if(!a||!a.sheetId)throw {code:'local',message:'Spreadsheet area '+areaName(r)+' belum didaftarkan.'};
      sid=a.sheetId;sheet="'DATA PEMINJAM'";col=k==='ar'?'R':'Y';first=5;
    }else{sid=ACC_ID;sheet="'ACC PUSAT'";col='Y';first=2}
    const keys=await getVals(sid,`${sheet}!B${first}:B5000`);
    const i=keys.findIndex(x=>String((x&&x[0])||'').trim()===r.nomor);
    if(i<0)throw {code:'local',message:'No. form tidak ditemukan di spreadsheet. Muat ulang lalu coba lagi.'};
    const row=first+i;
    await putVals(sid,`${sheet}!${col}${row}`,[[val]]);
    const back=await getVals(sid,`${sheet}!${col}${row}`);
    const ok=B(back[0]&&back[0][0])===val;
    if(ok){OVR[r.nomor]=Object.assign(OVR[r.nomor]||{t:Date.now()},{[k]:val})}
    try{await mcp.invalidate()}catch(e){}
    try{if(db&&ME.id)await db.collection('log').add({nomor:r.nomor,aksi:(val?'acc':'batal')+'_'+(k==='ar'?'armada_pusat':k==='ac'?'area':'manager'),by:ME.id,at:new Date().toISOString()})}catch(e){}
    await loadData();render();
    S.busy=false;const nr=ROWS.find(z=>z.nomor===r.nomor);if(nr)drawDetail(nr);
    say(ok?(val?'Tersimpan. Persetujuan tercatat di spreadsheet.':'Persetujuan dibatalkan di spreadsheet.'):'Perintah terkirim, tetapi nilai di spreadsheet belum berubah. Periksa hak edit Anda.',!ok);
  }catch(e){
    S.busy=false;const nr=ROWS.find(z=>z.nomor===r.nomor)||r;drawDetail(nr);
    say(e&&e.code==='local'?e.message:errText(e,k==='pu'?'ACC ARMADA PUSAT':'Spreadsheet area')+' Tidak ada yang diubah.',true);
  }
}

/* ---------- database utama: isian Google Form, terbaca otomatis ---------- */
function dbIngest(vals){
  const o=detectOrder(vals);
  DBROWS=vals.map(r=>mkRow(r,o,'FORM')).filter(Boolean).sort((x,y)=>((y.ts?+y.ts:0)-(x.ts?+x.ts:0))||y.nomor.localeCompare(x.nomor));
  const now=new Set(DBROWS.map(r=>r.nomor));
  let fresh=0;
  if(DBSEEN){for(const n of now)if(!DBSEEN.has(n)){DBNEW.add(n);fresh++}}
  DBSEEN=now;DBAT=Date.now();DBERR='';
  if(fresh&&isAdminLike()){loadData().then(()=>{render();renderDb()}).catch(()=>{})}
  renderDb(fresh);
}
async function pollDb(manual){
  try{const v=await getVals(FORM_ID,"'DATA'!A2:Q5000");dbIngest(v||[])}
  catch(e){DBERR=errText(e,'Spreadsheet formulir');renderDb()}
}
function startDb(){
  if(DBUNSUB||!mcp)return;
  $('dbInfo').textContent='Membaca data formulir …';
  pollDb();const t=setInterval(pollDb,60000);DBUNSUB=()=>clearInterval(t);
}
function stopDb(){if(DBUNSUB){try{DBUNSUB()}catch(e){}DBUNSUB=null}}
const dbFiltered=()=>{
  const q=$('dbQ').value.trim().toLowerCase(),ar=$('dbArea').value,rg=$('dbRange').value,start=new Date();start.setHours(0,0,0,0);
  const from=rg==='today'?+start:rg==='7'?+start-6*864e5:0;

};

  $('dbCount').textContent=`${fmtN(rows.length)} dari ${fmtN(DBROWS.length)} isian`;
  if(!rows.length){$('dbTbl').innerHTML='<div class="empty">'+(DBROWS.length?'Tidak ada isian yang cocok dengan filter.':(DBERR?'Data formulir belum bisa dibaca.':'Belum ada isian formulir.'))+'</div>';return}
  $('dbTbl').innerHTML=`<table><thead><tr><th>Waktu isi</th><th>No. form</th><th>Peminjam</th><th>Unit</th><th>Area</th><th>Tujuan</th><th>Pinjam sampai kembali</th><th>Posisi</th></tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr tabindex="0" data-n="${esc(r.nomor)}"><td class="num">${tglS(r.ts)}<small>${jam(r.ts)}</small></td><td class="num">${esc(r.nomor)}${DBNEW.has(r.nomor)?' <span class="pill p-park">Baru</span>':''}</td><td>${esc(r.nama)}<small>${esc(r.sp)}</small></td><td class="num">${esc(r.nopol)}<small>${esc(r.jenis)} ${esc(r.merk)}</small></td><td>${esc(areaName(r))}</td><td>${esc(r.tujLok)}<small>${esc(r.tuj)}</small></td><td class="num">${tglS(r.pinjam)}<small>sampai ${tglS(r.kembali)}</small></td><td>${inAcc.has(r.nomor)?'<span class="pill p-park">Di ACC pusat</span>':'<span class="pill p-first">Belum di ACC pusat</span>'}</td></tr>`).join('')}</tbody></table>`+(rows.length>300?'<div class="empty">Menampilkan 300 isian terbaru. Persempit dengan filter. CSV memuat semua yang tersaring.</div>':'');
}
async function dbCsv(){
  const dl=await window.claude.use('downloads').catch(()=>null);
  if(!dl){$('dbInfo').textContent='Penyimpanan file tidak tersedia di tampilan ini.';return}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['Waktu isi','No. form','Nama','No. KTP','No. SIM','No. WhatsApp','No. telepon aktif','Status peminjam','Nopol','Lokasi terakhir unit','Lokasi tujuan','Tujuan peminjaman','Jenis armada','Merk','Grup unit','Tanggal pinjam','Tanggal kembali'];
  const f=d=>d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`:'';
  const ft=d=>d?f(d)+' '+jam(d):'';
  const lines=[head.map(q).join(',')].concat(dbFiltered().map(r=>[ft(r.ts),r.nomor,r.nama,r.ktp,r.sim,r.wa,r.telp,r.sp,r.nopol,r.asal,r.tujLok,r.tuj,r.jenis,r.merk,r.grup,f(r.pinjam),f(r.kembali)].map(q).join(',')));
  try{await dl.save({filename:'Database Peminjaman Unit.csv',data:new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'})})}
  catch(e){$('dbInfo').textContent=(e&&e.code==='declined')?'Penyimpanan dibatalkan.':'Gagal menyiapkan CSV ('+((e&&e.code)||'error')+').'}
}
$('dbQ').oninput=()=>renderDb();$('dbArea').onchange=()=>renderDb();$('dbRange').onchange=()=>renderDb();$('dbCsv').onclick=dbCsv;
$('dbTbl').addEventListener('click',e=>{const tr=e.target.closest('tr[data-n]');if(tr)openRow(tr.dataset.n,tr)});
$('dbTbl').addEventListener('keydown',e=>{if(e.key==='Enter'){const tr=e.target.closest('tr[data-n]');if(tr)openRow(tr.dataset.n,tr)}});

async function boot(){
  gate('Memuat data peminjaman','Menyiapkan akses dan membaca spreadsheet.');
  const cl=window.claude;
  if(!cl||!cl.use){gate('Buka lewat Claude','Halaman ini membaca Google Sheets lewat konektor, jadi harus dibuka dari claude.ai.');return}
  [mcp,db,user]=await Promise.all([cl.use('mcp').catch(()=>null),cl.use('db').catch(()=>null),cl.use('user').catch(()=>null)]);
  let me={id:null,isOwner:false,canEdit:false};
  try{if(user)me=await user.me()}catch(e){}
  ME.id=me.id;ME.role=null;ME.areas=[];
  const AC=window.__acct;
  if(AC){ME.id=AC.user;if(AC.role==='admin')ME.role='admin';else if(AC.role==='pusat')ME.role='pusat';else if(AC.role==='daerah'){ME.role='daerah';ME.areas=(AC.areas||[]).slice()}}
  else if(me.isOwner||me.canEdit)ME.role='admin';
  else if(db&&me.id){
    try{const s=await db.doc('roles/'+me.id).get();if(s.exists){const x=s.data()||{};ME.role=x.role==='pusat'?'pusat':'daerah';ME.areas=Array.isArray(x.areas)?x.areas:[]}}catch(e){}
  }
  REAL.role=ME.role;REAL.areas=ME.areas.slice();
  {const u=$('unitName');if(u)u.textContent=unitTitle()}
  if(!ME.role){gate(AC?'Akun ini tidak punya akses ke fitur ini':'Akun Anda belum punya akses',AC?'Fitur Peminjaman Unit hanya untuk akun Admin, Armada Pusat, dan Armada Daerah. Masuk dengan akun lain.':'Minta admin menambahkan akun Anda dan menentukan areanya.');return}
  if(!mcp){gate('Konektor tidak tersedia','Halaman ini membutuhkan konektor Google Sheets. Buka lewat claude.ai dan izinkan konektornya.','Coba lagi');return}
  try{await loadAreas();await loadData()}catch(e){gate('Data belum bisa dibaca',errText(e),'Coba lagi');return}
  buildSim();
  if(ME.role==='daerah'&&ME.areas.length&&S.area==='ALL')S.area=ME.areas.length===1?ME.areas[0]:'ALL';
  if(!ROWS.length&&PROBLEMS.length){gate('Data belum bisa dibaca',PROBLEMS.join(' '),'Coba lagi');return}
  render();
}

  $('listView').hidden=t!=='list';$('usersView').hidden=t!=='users';$('dbView').hidden=t!=='db';

function buildSim(){
  const box=$('simBox');box.hidden=REAL.role!=='admin';
  if(box.hidden)return;
  const sel=$('simSel');
  const codes=Object.keys(AREAS);
  sel.innerHTML='<option value="">Uji peran: akun saya (Admin)</option><option value="pusat">Uji sebagai Manager / Armada Pusat</option>'+codes.map(c=>`<option value="d:${esc(c)}">Uji sebagai Armada Daerah ${esc(AREAS[c].name)}</option>`).join('');

  const v=e.target.value;SIMO={};closeRow();

  else if(v==='pusat'){SIM={role:'pusat',areas:[]};ME.role='pusat';ME.areas=[]}

(function(){
  const RD=document;window.__realDoc=RD;
  const done={};
  function mount(key){
    if(done[key])return;done[key]=true;
    const m=MODS[key],host=RD.getElementById('h-'+key),sr=host.attachShadow({mode:'open'});
    const st=RD.createElement('style');st.textContent=m.css;
    const mb=RD.createElement('div');mb.className='mbody';mb.innerHTML=m.html;
    sr.append(st,mb);
    const own=['pointerleave','visibilitychange'];
    const shim={
      getElementById:id=>sr.getElementById(id),
      querySelector:s=>sr.querySelector(s),
      querySelectorAll:s=>sr.querySelectorAll(s),
      createElement:t=>RD.createElement(t),
      body:mb,documentElement:host,
      contains:n=>!!n&&sr.contains(n),
      get hidden(){return RD.hidden||host.hidden},
      get activeElement(){return sr.activeElement},
      addEventListener:(t,f,o)=>(own.includes(t)?RD:sr).addEventListener(t,f,o),
      removeEventListener:(t,f,o)=>(own.includes(t)?RD:sr).removeEventListener(t,f,o)
    };
    try{m.run(shim)
      if(key==='peminjaman'){const un=sr.getElementById('unitName'),nb=RD.querySelector('.brand b');
        if(un&&nb)new MutationObserver(()=>{nb.textContent=un.textContent}).observe(un,{childList:true,characterData:true,subtree:true})}
    }catch(e){const d=RD.createElement('div');d.className='fail';d.textContent='Fitur ini gagal dimuat: '+(e&&e.message||e);mb.prepend(d)}
  }
  let unlocked=false,want='monitor';
  function show(key,focus){
    if(!unlocked)key='monitor';
    for(const k of Object.keys(MODS)){
      const on=k===key;RD.getElementById('h-'+k).hidden=!on;
      const b=RD.getElementById('t-'+k);b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;
    }
    mount(key);
    try{localStorage.setItem('armada-tab',key)}catch(e){}
    if(focus)scrollTo(0,0);
  }
  for(const b of RD.querySelectorAll('.mt'))b.onclick=()=>{want=b.dataset.m;show(b.dataset.m,true);try{history.replaceState(null,'','#'+b.dataset.m)}catch(e){}};
  RD.querySelector('.mods').addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    const ks=Object.keys(MODS),cur=ks.findIndex(k=>RD.getElementById('t-'+k).getAttribute('aria-selected')==='true');
    const nx=ks[(cur+(e.key==='ArrowRight'?1:ks.length-1))%ks.length];show(nx,true);RD.getElementById('t-'+nx).focus();
  });
  let first='monitor';
  try{const h=location.hash.slice(1);if(MODS[h])first=h;else{const s=localStorage.getItem('armada-tab');if(MODS[s])first=s}}catch(e){}
  want=first;
  RD.getElementById('mods').hidden=true;
  show('monitor',false);
  // Satu login untuk kedua fitur: kunci dipakai dari layar masuk Monitor, fitur lain terbuka setelah berhasil masuk.
  const sr=RD.getElementById('h-monitor').shadowRoot,app=sr&&sr.getElementById('app');
  if(sr){
    const h2=sr.querySelector('#login h2');if(h2)h2.textContent='Masuk ke Armada Pusat';
    const note=sr.getElementById('lgMsg');if(note)note.textContent='Satu akun untuk Monitor Ketepatan dan Peminjaman Unit. Hubungi admin untuk mendapatkan akun.';
  }
  function sync(){
    const on=!!app&&!app.hidden;
    if(on===unlocked)return;
    unlocked=on;RD.getElementById('mods').hidden=!on;
    if(on){if(want!=='monitor')show(want,false)}else show('monitor',false);
  }
  if(app){new MutationObserver(sync).observe(app,{attributes:true,attributeFilter:['hidden']});sync()}
})();
